name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beebike
          POSTGRES_PASSWORD: beebike
          POSTGRES_DB: beebike_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beebike -d beebike_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://beebike:beebike@localhost:5432/beebike_test
      DATABASE_URL: postgresql+psycopg://beebike:beebike@localhost:5432/beebike_test
      SECRET_KEY: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --desc || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint (eslint)
        run: npx eslint .

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=critical || true
